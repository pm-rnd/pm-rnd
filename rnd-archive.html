<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Art R&D Archive · 새 주소로 이동</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #1A1A1A; --surface: #262626; --line: #575757; --fg: #F2F2F2; --muted: #9C9C9C; --accent: #CFFF5E; --on-accent: #1A1A1A; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; font-size: 15px; line-height: 1.6; }
main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px; }
.label { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: var(--accent); }
h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; width: fit-content; min-height: 48px; padding: 0 24px; border-radius: 24px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
.btn:hover { filter: brightness(1.06); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.note { padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <span class="label">MOVED</span>
  <h1>R&amp;D Archive가<br>새 주소로 이동했어요</h1>
  <p>팀원 모두가 같은 데이터를 함께 쓰도록 옮겼어요. 네이버제트 구글 계정으로 로그인해야 열 수 있어요. 잠시 후 자동으로 이동하고, 이동하지 않으면 아래 버튼을 눌러 주세요.</p>
  <a class="btn" id="go" href="#">새 주소로 이동</a>
  <p class="note" id="soon" hidden>새 주소가 아직 설정되지 않았어요. 이 파일의 NEW_URL 값을 Apps Script 웹앱 주소로 바꿔 주세요.</p>
  <p class="note">예전 주소에 저장해 두었던 데이터는 이 브라우저에 그대로 남아 있어요. 새 아카이브로 옮기려면 관리자 화면의 "가져오기"를 이용하세요.</p>
</main>
<script>
// Apps Script 배포 후 나온 웹앱 주소(…/exec)로 바꾸세요.
var NEW_URL = 'https://script.google.com/a/macros/naverz-corp.com/s/AKfycbycPAIzPgdxfhCvO66DatS1wkTbb4PmuEgFA6UqmV03dFbytHoFuD4oC4cXfirokeIRJA/exec';

var go = document.getElementById('go');
if (/REPLACE_ME/.test(NEW_URL)) {
  go.hidden = true;
  document.getElementById('soon').hidden = false;
} else {
  // 예전 링크의 #글id는 새 주소의 ?p=글id로 넘겨 같은 글이 열리게 한다.
  var id = decodeURIComponent((location.hash || '').replace('#', '')).replace(/[^\w-]/g, '');
  var url = NEW_URL + (id ? '?p=' + encodeURIComponent(id) : '');
  go.href = url;
  setTimeout(function () { location.replace(url); }, 1500);
}
</script>
</body>
</html>
