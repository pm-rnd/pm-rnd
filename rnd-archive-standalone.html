<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Content Art R&D Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: dark archive shell with a top menu (archive / categories / admin). Grid or list for browsing, a 1120px case-study column for detail, tabbed admin panel (posts, drafts, categories) and a write form. */
:root {
  --bg: #1A1A1A;
  --surface: #262626;
  --surface-2: #222222;
  --line: #575757;
  --fg: #F2F2F2;
  --fg-2: #CFCFCF;
  --muted: #9C9C9C;
  --accent: #CFFF5E;
  --on-accent: #1A1A1A;
  --danger: #FF8A8A;
  --danger-bg: #2A1F1F;
  --danger-line: #5C3A3A;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--fg); text-decoration: none; }
a:hover { color: #fff; }
button, input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 700px) { .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }
.narrow { max-width: 1120px; }
.mono { font-family: var(--font-mono); }

/* menu */
header.top { border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 14px; }
.brand { font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: .08em; margin-right: auto; min-height: 44px; display: inline-flex; align-items: center; }
.menu { display: flex; flex-wrap: wrap; gap: 4px; order: 3; width: 100%; }
@media (min-width: 900px) { .menu { order: 0; width: auto; } }
.menu a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 22px; font-size: 14px; color: var(--muted); }
.menu a:hover { color: var(--fg); }
.menu a[aria-current="page"] { color: var(--fg); background: var(--surface); }
.menu .sw { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex: none; }
.top-right { display: flex; align-items: center; gap: 12px; }
.fab { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.fab:hover { color: var(--on-accent); filter: brightness(1.06); }
.admin-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); font-size: 14px; color: var(--fg-2); }
.badge { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--muted); font-size: 14px; }

.intro { padding-block: 64px 36px; display: flex; flex-direction: column; gap: 16px; }
.intro h1 { margin: 0; font-size: clamp(36px, 6vw, 56px); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.intro p { margin: 0; font-size: 17px; line-height: 1.7; color: var(--muted); max-width: 640px; }

.tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 24px; }
.tools-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.search { height: 44px; width: 260px; max-width: 100%; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; }
.search::placeholder { color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 22px; padding: 3px; gap: 2px; }
.seg button { min-width: 44px; height: 36px; padding: 0 14px; border-radius: 18px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg.light button[aria-pressed="true"] { background: var(--fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 48px 32px; padding-block: 8px 96px; }
@media (min-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.thumb { aspect-ratio: 16 / 10; border-radius: 16px; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; font-size: 13px; color: var(--muted); background: var(--surface); }
.card:hover .thumb, .card:focus-visible .thumb { outline: 2px solid var(--fg); outline-offset: 3px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.thumb .status { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--fg); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: #8A8A8A; }
.dot.live { background: var(--accent); }
.meta { display: flex; flex-direction: column; gap: 8px; }
.meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cat { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; color: var(--on-accent); background: var(--line); }
.date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card-title { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: #A3A3A3; }

.table-scroll { overflow-x: auto; border-top: 1px solid var(--line); margin-bottom: 96px; }
.table { min-width: 860px; }
.tr { display: grid; grid-template-columns: 96px minmax(0, 1fr) 140px 220px 100px; gap: 16px; padding: 18px 8px; align-items: center; border-bottom: 1px solid var(--line); }
.tr.head { padding: 12px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
a.tr:hover { background: var(--surface-2); }
.empty { padding: 96px 0; text-align: center; color: var(--muted); }

footer.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 32px 48px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer.foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; display: inline-flex; min-height: 24px; }

/* detail */
.d-head { padding-block: 64px 32px; display: flex; flex-direction: column; gap: 16px; }
.d-head h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.lead { margin: 0; font-size: 18px; line-height: 1.7; color: var(--muted); max-width: 760px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.hero { max-width: 800px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
.play { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; padding-block: 24px; margin: 40px 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.fact { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact dt { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.fact dd { margin: 0; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.sec { padding-top: 72px; }
.sec-label { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.sec h2 { margin: 8px 0 0; font-size: 26px; line-height: 1.3; font-weight: 700; }
.purpose { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 12px 24px; }
@media (max-width: 700px) { .purpose { grid-template-columns: minmax(0, 1fr); } .purpose > p { grid-column: 1 !important; } }
.purpose p, .step p { margin: 0; font-size: 16px; line-height: 1.8; color: var(--fg-2); overflow-wrap: anywhere; }
.steps { display: flex; flex-direction: column; margin-top: 24px; }
.step { display: flex; gap: 20px; }
@media (min-width: 700px) { .step { gap: 32px; } }
.rail { flex: none; width: 44px; display: flex; flex-direction: column; align-items: center; }
.num { width: 44px; height: 44px; border-radius: 50%; background: #D9D9D9; color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; }
.rail i { flex: 1; width: 1px; background: #6E6E6E; }
.step-body { flex: 1; min-width: 0; margin-bottom: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 32px; }
@media (min-width: 700px) { .step-body { padding: 48px 56px 56px; gap: 48px; } }
.step:last-child .step-body { margin-bottom: 0; }
.step h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; color: #8A84F9; }
.ph { width: 100%; aspect-ratio: 16 / 9; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
figure { margin: 0 auto; width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
figcaption { font-size: 15px; font-weight: 500; color: var(--fg-2); }
.outcomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; margin-top: 24px; }
.outcome { background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.outcome h3 { margin: 0; font-size: 17px; font-weight: 500; color: #B080E7; }
.outcome p { margin: 0; font-size: 15px; line-height: 1.8; color: var(--fg-2); }
.related { padding-block: 96px; }
.related h2 { margin: 0 0 24px; padding-top: 72px; border-top: 1px solid var(--line); font-size: 22px; font-weight: 700; }
.related .grid { padding-block: 0; }
.admin-edit { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); font-size: 14px; color: var(--fg-2); width: fit-content; }

/* admin */
.admin-main { padding-block: 48px 120px; display: flex; flex-direction: column; gap: 32px; }
.notice { margin: 0; padding: 12px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); }
.tab { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border: none; background: transparent; cursor: pointer; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { font-weight: 700; color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #2E2E2E; color: var(--muted); }
.tab[aria-selected="true"] .n { background: var(--accent); color: var(--on-accent); }
.panel-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.panel-h h2 { margin: 0; font-size: 22px; font-weight: 700; }
.panel-h p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.list { border-top: 1px solid var(--line); }
.prow-wrap { border-bottom: 1px solid var(--line); }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 8px; }
.prow:hover { background: #202020; }
.prow .ix { font-family: var(--font-mono); font-size: 13px; color: var(--muted); width: 24px; }
.prow .th { width: 80px; height: 50px; border-radius: 8px; background: var(--surface); flex: none; }
.prow .info { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.prow .info b { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.prow .info div { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ib { width: 44px; height: 44px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ib:hover:not(:disabled) { background: #2E2E2E; color: var(--fg); }
.ib:disabled { opacity: .3; cursor: default; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--fg-2); font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.btn:hover { color: var(--fg); border-color: #8A8A8A; }
.btn.danger { color: var(--danger); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { color: var(--on-accent); filter: brightness(1.06); }
.btn.solid-danger { background: var(--danger); color: var(--on-accent); border-color: var(--danger); font-weight: 700; }
.confirm { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 0 8px 14px; padding: 14px 18px; border-radius: 10px; background: var(--danger-bg); border: 1px solid var(--danger-line); font-size: 14px; }
.drafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.draft { border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.draft b { font-size: 17px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.draft small { font-size: 13px; color: var(--muted); }
.draft .tagd { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; border: 1px dashed #6E6E6E; color: var(--muted); }
.catrow { border-bottom: 1px solid var(--line); padding: 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.catrow .line { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; flex: none; }
.editbox { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 10px; background: var(--surface-2); }
.dashed { height: 56px; border-radius: 12px; border: 1px dashed #6E6E6E; background: transparent; color: var(--fg-2); font-size: 15px; cursor: pointer; }
.dashed:hover { border-color: #8A8A8A; color: var(--fg); }
.palette { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pal { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
.pal[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }

/* form */
.field { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .editbox input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font-size: 15px; padding: 0 14px; height: 44px; }
.field textarea { height: auto; min-height: 110px; padding: 12px 14px; line-height: 1.7; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .editbox input:focus { outline: none; border-color: var(--accent); }
.form { display: flex; flex-direction: column; gap: 24px; max-width: 760px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 24px; }
.err { color: var(--danger); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--on-accent); padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
.hero.has { padding: 0; overflow: hidden; }
.hero.has img { width: 100%; height: 100%; object-fit: cover; }
.bt { margin: 0; font-size: 16px; line-height: 1.8; color: var(--fg-2); overflow-wrap: anywhere; width: 100%; max-width: 760px; margin-inline: auto; }
.imgs { display: grid; gap: 12px; width: 100%; }
.imgs.n1 { grid-template-columns: minmax(0, 1fr); }
.imgs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.imgs.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.imgs .ph { aspect-ratio: 4 / 3; }
.mi { width: 100%; display: block; border-radius: 4px; }
.it { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; align-items: center; width: 100%; max-width: 760px; margin: 0 auto; }
.it .bt { margin: 0; }
.vlink { color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }
.step-body { gap: 28px; }
.sect { display: flex; flex-direction: column; gap: 20px; padding-top: 32px; border-top: 1px solid var(--line); }
.sh { margin: 0; font-size: 18px; font-weight: 700; }
.stepc { border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.blk { background: var(--surface-2); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.blk-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.addbar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.small { height: 36px; padding: 0 14px; font-size: 13px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.slot { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot .btn { width: fit-content; }
.pv { aspect-ratio: 4 / 3; background: var(--surface); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; overflow: hidden; }
.pv img { width: 100%; height: 100%; object-fit: cover; }
.fileb { position: relative; }
.fileb input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.fileb:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
.tagbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.tagbox:focus-within { border-color: var(--accent); }
.field .tagbox input { flex: 1 1 120px; min-width: 0; width: auto; border: none; background: transparent; height: 32px; padding: 0 4px; }
.chip-t { display: inline-flex; align-items: center; gap: 2px; font-family: var(--font-mono); font-size: 12px; padding: 0 2px 0 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); }
.chip-t button { width: 32px; height: 32px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-radius: 50%; font-size: 16px; }
.actbar { position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.prevbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.prev-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 12px; }
.relist { display: flex; flex-direction: column; }
.relist label { display: flex; gap: 12px; align-items: center; min-height: 44px; font-size: 14px; color: var(--fg-2); }
.relist input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.form { max-width: 820px; }
.field select { appearance: auto; }
@media (max-width: 600px) { .imgs.n3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
body { margin: 0; }
</style>

</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  var KEY = 'rnd-archive-v1';
  var PALETTE = ['#CFFF5E', '#8A84F9', '#B080E7', '#F16BFF', '#ACCBF4'];
  var PH = '[입력 예정]';

  // 시안의 샘플 데이터입니다. 실제 R&D 내용으로 교체하세요.
  var DEFAULT = {
    cats: [
      { key: 'art', name: '콘텐츠 아트', color: '#B080E7' },
      { key: 'booth', name: '부스', color: '#CFFF5E' },
      { key: 'd3', name: '3D', color: '#8A84F9' },
      { key: 'ani', name: 'ANI', color: '#F16BFF' }
    ],

      var steps = o.steps, si = +el.dataset.s, bi = +el.dataset.b;
      if (a === 'addstep') steps.push({ title: '', blocks: [{ type: 'text', text: '' }] });
      else if (a === 'delstep') { if (steps.length < 2) { toast('단계는 최소 1개가 필요해요'); return; } W.confirmStep = si; }
      else if (a === 'cancelstep') W.confirmStep = null;
      else if (a === 'okdelstep') { steps.splice(si, 1); W.confirmStep = null; }
      else if (a === 'addblock') steps[si].blocks.push(newBlock(el.dataset.t));
      else if (a === 'delblock') steps[si].blocks.splice(bi, 1);
      else if (a === 'bup' && bi > 0) { var bl = steps[si].blocks, t = bl[bi]; bl[bi] = bl[bi - 1]; bl[bi - 1] = t; }
      else if (a === 'bdown' && bi < steps[si].blocks.length - 1) { var bl2 = steps[si].blocks, t2 = bl2[bi]; bl2[bi] = bl2[bi + 1]; bl2[bi + 1] = t2; }
      else return;
      document.getElementById('steps').innerHTML = stepsEditor(); touch();
    });
    document.getElementById('tagbox').addEventListener('keydown', function (e) {
      var el = e.target;
      if (el.id !== 'f-tagin') return;
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        var t = el.value.trim().replace(/,$/, '').toUpperCase();
        if (t && o.tags.indexOf(t) < 0) o.tags.push(t);
        document.getElementById('tagbox').innerHTML = tagsEditor(); document.getElementById('f-tagin').focus();
        document.getElementById('rel').innerHTML = relEditor(); touch();
      } else if (e.key === 'Backspace' && !el.value && o.tags.length) { o.tags.pop(); document.getElementById('tagbox').innerHTML = tagsEditor(); document.getElementById('f-tagin').focus(); touch(); }
    });
    document.getElementById('publish').addEventListener('click', publish);
    document.getElementById('preview').addEventListener('click', drawPreview);
    var sd = document.getElementById('save-draft'); if (sd) sd.addEventListener('click', saveDraft);
  }
  function publish() {
    var o = W.o, err = document.getElementById('err');
    if (!o.title.trim()) { err.textContent = '제목을 입력하세요.'; document.getElementById('f-title').focus(); return; }
    if (!/^\d{4}\.\d{2}$/.test(o.date)) { err.textContent = '날짜는 2026.11 형식으로 입력하세요.'; document.getElementById('f-date').focus(); return; }
    o.title = o.title.trim(); clearTimeout(asTimer);
    var target;
    if (W.existing && !W.isDraft) { Object.keys(o).forEach(function (k) { W.existing[k] = o[k]; }); target = W.existing; }
    else {
      target = JSON.parse(JSON.stringify(o)); target.id = 'rd-' + Date.now().toString(36); delete target.meta;
      data.items.push(target);
      if (W.isDraft) data.drafts = data.drafts.filter(function (x) { return x.id !== W.id; });
    }
    if (data.autosave) delete data.autosave[W.key];
    if (save()) { toast('발행했어요'); location.hash = '#' + target.id; }
  }
  function saveDraft() {
    var o = W.o, d = W.isDraft ? W.existing : { id: 'draft-' + Date.now().toString(36) }, now = new Date();
    clearTimeout(asTimer);
    Object.keys(o).forEach(function (k) { d[k] = JSON.parse(JSON.stringify(o[k])); });
    d.meta = '[작성자] · ' + now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate()) + ' 저장 · 단계 ' + o.steps.length + '개';
    if (!W.isDraft) data.drafts.push(d);
    if (data.autosave) delete data.autosave[W.key];
    ui.tab = 'drafts';
    if (save()) { toast('임시저장했어요'); location.hash = '#admin'; }
  }
  function drawPreview() {
    var it = JSON.parse(JSON.stringify(W.o)); it.id = W.id || '__preview';
    document.title = '미리보기 · R&D Archive';
    app.innerHTML = '<div class="prevbar"><div class="wrap narrow prev-in"><span class="badge">미리보기</span><span style="color:var(--muted);font-size:13px">발행 전 모습이에요. 이 화면의 링크는 눌러도 저장되지 않아요.</span><button type="button" class="btn" id="pv-back" style="margin-left:auto">편집으로 돌아가기</button></div></div>' +
      '<div class="wrap narrow">' + detailBody(it, true) + '</div>';
    document.getElementById('pv-back').addEventListener('click', function () { drawWrite(); window.scrollTo(0, 0); });
    window.scrollTo(0, 0);
  }

  /* ---------- router ---------- */
  function route() {
    var h = decodeURIComponent((location.hash || '').replace('#', ''));
    ui.confirm = null; ui.editCat = null; clearTimeout(asTimer); W = null;
    if (h === 'admin') renderAdmin();
    else if (h === 'write') renderWrite(null);
    else if (h.indexOf('edit-') === 0) renderWrite(h.slice(5));
    else if (h.indexOf('cat-') === 0 && catOf(h.slice(4))) renderArchive(h.slice(4));
    else if (itemOf(h)) renderDetail(itemOf(h));
    else renderArchive('all');
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
